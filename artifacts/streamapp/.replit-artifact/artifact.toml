kind = "mobile"
previewPath = "/"
title = "StreamApp"
version = "1.0.0"
id = "artifacts/streamapp"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24654

[services.development]
run = "pnpm --filter @workspace/streamapp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/streamapp", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/streamapp", "run", "serve" ]

[services.env]
PORT = "24654"
BASE_PATH = "/"
